<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Mon Alerte</title>
</head>
<body>
    <h1>Panneau de contrôle</h1>
    <button id="sendBtn" style="padding: 20px; font-size: 20px; cursor: pointer;">Envoyer une alerte</button>

    <script>
        const TOPIC = "votre_topic_unique"; // Remplacez par votre nom de topic

        document.getElementById('sendBtn').addEventListener('click', () => {
            fetch(`https://ntfy.sh/${TOPIC}`, {
                method: 'POST',
                body: 'Une nouvelle alerte est arrivée !'
            }).then(() => alert("Message envoyé !"));
        });

        // Enregistrement strict du Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW enregistré', reg))
                .catch(err => console.log('Erreur SW', err));
        }
    </script>
</body>
</html>
