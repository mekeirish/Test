<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <title>Système d'Alerte</title>
</head>
<body>
    <h1>Panneau de contrôle</h1>
    <button id="sendBtn" style="padding: 20px; font-size: 20px;">Envoyer une alerte</button>

    <script>
        // Remplacez "votre_topic_unique" par un nom de topic secret
        const TOPIC = "votre_topic_unique";

        document.getElementById('sendBtn').addEventListener('click', () => {
            fetch(`https://ntfy.sh/${TOPIC}`, {
                method: 'POST',
                body: 'Une nouvelle alerte est arrivée !'
            });
        });

        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
