<html lang="fr"><head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .btn-yes {
            padding: 30px 80px;
            font-size: 2rem;
            font-weight: bold;
            color: #5d4037;
            background: linear-gradient(180deg, #ffd54f 0%, #ffc107 100%);
            border: none;
            border-radius: 20px;
            cursor: pointer;
            
            /* Effet Skeuomorphique : double ombre pour le relief */
            box-shadow: 
                0 10px 0 #b38e00,        /* Ombre profonde */
                0 15px 20px rgba(0,0,0,0.5); /* Ombre portée */
            
            transition: all 0.1s ease;
        }

        .btn-yes:active {
            /* Effet enfoncé */
            transform: translateY(10px);
            box-shadow: 
                0 0 0 #b38e00, 
                0 5px 10px rgba(0,0,0,0.5);
        }
    </style>

<link rel="manifest" href="./manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b6cb7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon.png">
</head>
<body>

    <button class="btn-yes">YES</button>




<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker enregistré !'))
        .catch(err => console.error('Erreur SW :', err));
    });
  }
</script>
</body></html>
