<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="xr-spatial-tracking=(self)">
    <meta name="theme-color" content="#0f172a">
    <title>AR Real Measure</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: 'rgba(15, 23, 42, 0.85)',
                    }
                }
            }
        }
    </script>
    
    <!-- Three.js et ARButton -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.160.0/examples/jsm/webxr/ARButton.js"></script>
    
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-hidden select-none m-0 p-0">

    <!-- En-tête -->
    <header class="absolute top-4 left-4 right-4 p-4 glass-panel rounded-2xl z-10 flex justify-between items-center shadow-lg pointer-events-none">
        <div class="flex items-center gap-3">
            <img src="icon.png" alt="Logo" class="w-7 h-7 rounded-lg">
            <h1 class="font-bold text-lg tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-400 bg-clip-text text-transparent">AR Real Measure</h1>
        </div>
        <div id="status-badge" class="px-3 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-300 border border-amber-500/30">
            Initialisation...
        </div>
    </header>

    <!-- Affichage distance -->
    <div id="info-card" class="absolute top-24 left-1/2 -translate-x-1/2 glass-panel px-6 py-3 rounded-2xl z-10 text-center shadow-2xl border border-cyan-500/30 hidden pointer-events-none">
        <p class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Distance mesurée</p>
        <p id="distance-display" class="text-2xl font-bold text-cyan-300">-- cm</p>
    </div>

    <!-- Instructions contextuelles -->
    <div id="instruction-banner" class="absolute bottom-32 left-1/2 -translate-x-1/2 glass-panel px-4 py-2 rounded-xl text-amber-300 font-medium text-xs shadow-2xl border border-amber-500/30 text-center max-w-xs z-10 pointer-events-none">
        Vérification des capacités AR du téléphone...
    </div>

    <!-- Conteneur bouton AR / Fallback -->
    <div id="ar-button-container" class="absolute bottom-10 left-1/2 -translate-x-1/2 z-50"></div>

    <script>
        let camera, scene, renderer;
        let controller;
        let reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;

        let points = [];
        let lineMesh = null;
        const materialLine = new THREE.LineBasicMaterial({ color: 0x06b6d4, linewidth: 5 });

        const statusBadge = document.getElementById('status-badge');
        const infoCard = document.getElementById('info-card');
        const distanceDisplay = document.getElementById('distance-display');
        const instructionBanner = document.getElementById('instruction-banner');
        const arContainer = document.getElementById('ar-button-container');

        // Enregistrement Service Worker basique pour valider la PWA
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        init();

        async function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Détection du mode PWA Standalone
            const isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

            if ('xr' in navigator) {
                try {
                    const supported = await navigator.xr.isSessionSupported('immersive-ar');
                    
                    if (supported) {
                        statusBadge.textContent = 'AR Prête';
                        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
                        instructionBanner.textContent = "Cliquez ci-dessous pour lancer la caméra AR.";
                        
                        const arButton = ARButton.createButton(renderer, {
                            requiredFeatures: ['hit-test'],
                            optionalFeatures: ['dom-overlay'],
                            domOverlay: { root: document.body }
                        });
                        arButton.className = 'px-6 py-3.5 rounded-2xl font-bold bg-cyan-600 hover:bg-cyan-500 text-white shadow-2xl transition active:scale-95 text-base border border-cyan-400/40 cursor-pointer';
                        arButton.textContent = '🚀 Démarrer le Mètre AR';
                        arContainer.appendChild(arButton);
                    } else {
                        handleIncompatibility(isPWA);
                    }
                } catch (e) {
                    handleIncompatibility(isPWA);
                }
            } else {
                handleIncompatibility(isPWA);
            }

            // Réticule
            const geometry = new THREE.RingGeometry(0.07, 0.09, 32).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            window.addEventListener('resize', onWindowResize);

            renderer.xr.addEventListener('sessionstart', () => {
                statusBadge.textContent = 'AR Active';
                instructionBanner.textContent = "Pointez le sol/mur et touchez l'écran pour placer vos points.";
            });

            renderer.xr.addEventListener('sessionend', () => {
                statusBadge.textContent = 'AR Inactive';
                infoCard.classList.add('hidden');
                instructionBanner.textContent = "Session terminée.";
                resetMeasurement();
            });

            animate();
        }

        function handleIncompatibility(isPWA) {
            statusBadge.textContent = 'AR Restreinte';
            statusBadge.className = 'px-3 py-1 rounded-full text-xs font-medium bg-rose-500/20 text-rose-300 border border-rose-500/30';

            if (isPWA) {
                instructionBanner.textContent = "Android bloque l'AR en mode PWA plein écran.";
                const cleanUrl = location.href.replace(/^https?:\/\//, '');
                const chromeIntentUrl = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;

                arContainer.innerHTML = `
                    <a href="${chromeIntentUrl}" class="px-6 py-3.5 rounded-2xl font-bold bg-indigo-600 hover:bg-indigo-500 text-white shadow-2xl block text-center border border-indigo-400/40 text-sm">
                        Ouvrir dans Chrome Native
                    </a>
                `;
            } else {
                instructionBanner.textContent = "Vérifiez que ARCore est à jour et utilisez Chrome Mobile.";
                arContainer.innerHTML = `
                    <div class="p-3 rounded-xl bg-rose-950/80 text-rose-200 text-xs border border-rose-500/30 text-center">
                        Navigateur non compatible WebXR AR.
                    </div>
                `;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function onSelect() {
            if (reticle.visible) {
                const position = new THREE.Vector3();
                position.setFromMatrixPosition(reticle.matrix);

                const sphereGeo = new THREE.SphereGeometry(0.015, 32, 32);
                const sphereMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                const sphereMesh = new THREE.Mesh(sphereGeo, sphereMat);
                sphereMesh.position.copy(position);
                scene.add(sphereMesh);

                points.push(position);

                if (points.length === 1) {
                    instructionBanner.textContent = "Point 1 placé ! Touchez l'écran pour le Point 2.";
                } else if (points.length === 2) {
                    const distanceMeters = points[0].distanceTo(points[1]);
                    const distanceCm = distanceMeters * 100;

                    infoCard.classList.remove('hidden');
                    distanceDisplay.textContent = distanceCm >= 100 ? `${distanceMeters.toFixed(2)} m` : `${distanceCm.toFixed(1)} cm`;

                    const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                    lineMesh = new THREE.Line(lineGeo, materialLine);
                    scene.add(lineMesh);

                    instructionBanner.textContent = "Mesure terminée. Touchez à nouveau pour réinitialiser.";
                } else {
                    resetMeasurement();
                    const sphereGeo2 = new THREE.SphereGeometry(0.015, 32, 32);
                    const sphereMat2 = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                    const sphereMesh2 = new THREE.Mesh(sphereGeo2, sphereMat2);
                    sphereMesh2.position.copy(position);
                    scene.add(sphereMesh2);
                    points.push(position);
                    instructionBanner.textContent = "Point 1 placé ! Touchez l'écran pour le Point 2.";
                }
            }
        }

        function resetMeasurement() {
            points = [];
            if (lineMesh) {
                scene.remove(lineMesh);
                lineMesh = null;
            }
            scene.children = scene.children.filter(child => {
                return child === reticle || child === controller || child instanceof THREE.HemisphereLight;
            });
            infoCard.classList.add('hidden');
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((referenceSpace) => {
                        session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
