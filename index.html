<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Analycode v3.8 • Perfect Anchor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <style>
    button, textarea, input { touch-action: manipulation; }
    .context-block {
      white-space: pre;
      overflow-x: auto;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.75rem;
      line-height: 1.4;
    }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #2d2d3a; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #22d3ee; }
  </style>
</head>
<body class="bg-black text-gray-200 antialiased">
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    (function() {
      const { useState, useEffect, useCallback, useRef, useMemo } = React;

      const STATIC_TOKENS = {
        structure: ["div", "button", "input", "label", "span", "h1", "canvas", "img", "svg", "path"],
        hooks: ["useState", "useEffect", "useRef", "useCallback", "useMemo"],
        events: ["onClick", "onChange", "onSubmit", "onTouchStart", "onTouchEnd", "onMouseDown", "onMouseUp"],
        styles: ["className", "bg-[#050505]", "bg-[#0a0a0c]", "border-[#2d2d3a]", "text-cyan-400", "backdrop-blur-sm"]
      };

      const executeUniversalCopy = (textToCopy) => {
        if (!textToCopy) return false;
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(textToCopy).catch(() => {});
          return true;
        }
        try {
          const textArea = document.createElement("textarea");
          textArea.value = textToCopy;
          textArea.style.position = "fixed";
          textArea.style.left = "-9999px";
          textArea.style.top = "-9999px";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          const successful = document.execCommand("copy");
          document.body.removeChild(textArea);
          return successful;
        } catch (err) {
          return false;
        }
      };

      // MOTEUR D'EXTRACTION AVEC ANCRAGE DE TAG STRICT v3.8
      const extractFullElementBlock = (fullCode, startIndex, term) => {
        if (!fullCode || startIndex === -1) return null;

        const cleanTerm = term.replace(/[<\/>]/g, "").trim();
        
        // ÉTAPE 1 : Identifier si le terme recherché correspond à un tag connu
        let targetTagName = "div"; 
        const isKnownTag = STATIC_TOKENS.structure.includes(cleanTerm.toLowerCase());
        if (isKnownTag) {
          targetTagName = cleanTerm.toLowerCase();
        } else {
          // Si c'est une classe ou du texte, on essaie de deviner le tag le plus proche à gauche
          const preMatch = fullCode.substring(0, startIndex).match(/<([a-zA-Z0-9]+)(?:\s+[^>]*>|>)[^<]*$/);
          if (preMatch) targetTagName = preMatch[1].toLowerCase();
        }

        // ÉTAPE 2 : Remonter à gauche pour trouver l'OUVERTURE STRICTE de CE tag précis
        const codeBefore = fullCode.substring(0, startIndex + cleanTerm.length);
        const openingRegex = new RegExp(`<(${targetTagName})(?:\\s+[^>]*>|>)`, 'gi');
        const allOpenings = [...codeBefore.matchAll(openingRegex)];
        const lastOpeningMatch = allOpenings.pop();

        if (!lastOpeningMatch) {
          return fullCode.substring(startIndex, startIndex + cleanTerm.length);
        }
        
        const realStart = lastOpeningMatch.index;
        const tagName = lastOpeningMatch[1];

        if (lastOpeningMatch[0].endsWith('/>')) {
          return fullCode.substring(realStart, lastOpeningMatch.index + lastOpeningMatch[0].length);
        }

        // ÉTAPE 3 : Compter la profondeur avec précision chirurgicale
        let depth = 0;
        const tagFinder = new RegExp(`(<\\s*${tagName}[>\\s]|<\\s*\\/\\s*${tagName}\\s*>)`, 'gi');
        tagFinder.lastIndex = realStart;
        let match;
        
        while ((match = tagFinder.exec(fullCode)) !== null) {
          const currentTag = match[0].toLowerCase();
          
          if (!currentTag.includes('/')) {
            const isSelfClosing = fullCode.substring(match.index, fullCode.indexOf('>', match.index) + 1).endsWith('/>');
            if (isSelfClosing) {
              if (depth === 0) return fullCode.substring(realStart, fullCode.indexOf('>', match.index) + 1);
            } else {
              depth++;
            }
          } else {
            depth--;
            if (depth === 0) {
              const endIdx = match.index + match[0].length;
              return fullCode.substring(realStart, endIdx).trim();
            }
          }
        }

        return fullCode.substring(realStart, Math.min(realStart + 250, fullCode.length));
      };

      const LiveSandBox = ({ code, sourceCode }) => {
        const containerRef = useRef(null);
        const [error, setError] = useState(null);

        useEffect(() => {
          if (!code || !containerRef.current) return;
          setError(null);
          containerRef.current.innerHTML = "";
          
          if (sourceCode) {
            const styleRegex = /<style[^>]*>([\s\S]*?)<\/style>/gi;
            let styleMatch;
            while ((styleMatch = styleRegex.exec(sourceCode)) !== null) {
              const styleElement = document.createElement("style");
              styleElement.textContent = styleMatch[1];
              containerRef.current.appendChild(styleElement);
            }
          }

          const mountPoint = document.createElement("div");
          mountPoint.className = "w-full max-w-full flex items-center justify-center p-2 flex-wrap overflow-hidden box-border text-inherit";
          containerRef.current.appendChild(mountPoint);

          try {
            let preparedCode = code.trim();

            preparedCode = preparedCode.replace(/on[A-Z][a-zA-Z]*\s*=\s*\{[^}]+\}/g, (match) => {
              const eventType = match.split('=')[0].trim();
              return `${eventType}={(() => {})}`;
            });

            if (preparedCode.startsWith("const") || preparedCode.startsWith("function")) {
              const compNameMatch = preparedCode.match(/(?:const|function)\s+([A-Z][a-zA-Z0-9_]*)/);
              if (compNameMatch) {
                const compName = compNameMatch[1];
                preparedCode = `${preparedCode};\n\nrenderTarget = <${compName} />;`;
              }
            } else {
              if (!preparedCode.startsWith("<")) {
                preparedCode = `<span className="${preparedCode.includes(' ') ? preparedCode : ''} text-xs font-mono break-all">${preparedCode}</span>`;
              }
              preparedCode = `renderTarget = (${preparedCode});`;
            }

            const executionWrapper = `
              (function() {
                let renderTarget = null;
                const { useState, useEffect, useRef, useCallback, useMemo } = React;
                try {
                  ${preparedCode}
                  return renderTarget;
                } catch(e) {
                  return React.createElement("span", {className: "text-red-400 text-[10px] font-mono"}, "Aperçu indisponible");
                }
              })()
            `;

            const compiled = Babel.transform(executionWrapper, { presets: ['react'] }).code;
            const ReactComponentIsolated = eval(compiled);
            
            const root = ReactDOM.createRoot(mountPoint);
            root.render(ReactComponentIsolated);

            return () => {
              setTimeout(() => root.unmount(), 0);
            };
          } catch (err) {
            try {
              let safeHtml = code.replace(/className\s*=\s*"/g, 'class="');
              safeHtml = safeHtml.replace(/\{[^}]+\}/g, "");
              mountPoint.innerHTML = safeHtml;
            } catch(e) {
              setError("Rendu visuel impossible");
            }
          }
        }, [code, sourceCode]);

        if (error) return <div className="text-[10px] font-mono text-gray-600 italic p-2">{error}</div>;

        return (
          <div ref={containerRef} className="w-full min-h-[110px] bg-[#0c0c12] rounded-xl border border-[#2d2d3a] p-2 flex flex-col items-center justify-center overflow-hidden relative shadow-inner" />
        );
      };

      const CodeExplorer = () => {
        const [sourceCode, setSourceCode] = useState("");
        const [searchTerm, setSearchTerm] = useState("");
        const [matches, setMatches] = useState([]);
        const [currentMatchIdx, setCurrentMatchIdx] = useState(0);
        const [isolatedBlock, setIsolatedBlock] = useState("");
        const [copied, setCopied] = useState(false);
        const [stateCopied, setStateCopied] = useState(false);
        const [activeTab, setActiveTab] = useState("structure");

        const dynamicComponents = useMemo(() => {
          if (!sourceCode) return [];
          const regex = /(?:const|function)\s+([A-Z][a-zA-Z0-9_]*)/g;
          const components = new Set();
          let match;
          while ((match = regex.exec(sourceCode)) !== null) {
            components.add(match[1]);
          }
          const tagRegex = /<([A-Z][a-zA-Z0-9_]*)/g;
          while ((match = tagRegex.exec(sourceCode)) !== null) {
            components.add(match[1]);
          }
          return Array.from(components);
        }, [sourceCode]);

        const categories = useMemo(() => ({
          ...STATIC_TOKENS,
          customs: dynamicComponents
        }), [dynamicComponents]);

        const findMatches = useCallback((code, term) => {
          if (!term || !code) return [];
          const cleanTerm = term.replace(/[<\/>]/g, "").trim();
          const results = [];
          let index = 0;
          while (index < code.length) {
            const found = code.toLowerCase().indexOf(cleanTerm.toLowerCase(), index);
            if (found === -1) break;
            results.push({ start: found, length: cleanTerm.length });
            index = found + Math.max(1, cleanTerm.length);
          }
          return results;
        }, []);

        useEffect(() => {
          const newMatches = findMatches(sourceCode, searchTerm);
          setMatches(newMatches);
          setCurrentMatchIdx(0);
        }, [sourceCode, searchTerm, findMatches]);

        useEffect(() => {
          if (matches.length === 0 || currentMatchIdx >= matches.length) {
            setIsolatedBlock("");
            return;
          }
          const match = matches[currentMatchIdx];
          const block = extractFullElementBlock(sourceCode, match.start, searchTerm);
          setIsolatedBlock(block || "");
        }, [matches, currentMatchIdx, sourceCode, searchTerm]);

        const handleCopy = () => {
          if (!isolatedBlock) return;
          const success = executeUniversalCopy(isolatedBlock);
          if (success) {
            setCopied(true);
            if (window.navigator?.vibrate) window.navigator.vibrate(15);
            setTimeout(() => setCopied(false), 1500);
          }
        };

        const handleCopyState = () => {
          const debugState = {
            analycodeVersion: "3.8",
            timestamp: new Date().toISOString(),
            searchTerm: searchTerm,
            matchIndex: matches.length > 0 ? currentMatchIdx + 1 : 0,
            totalMatches: matches.length,
            isolatedBlock: isolatedBlock,
            fullSourceCode: sourceCode
          };
          const success = executeUniversalCopy(JSON.stringify(debugState, null, 2));
          if (success) {
            setStateCopied(true);
            if (window.navigator?.vibrate) window.navigator.vibrate(25);
            setTimeout(() => setStateCopied(false), 1500);
          }
        };

        return (
          <div className="fixed inset-0 bg-black flex items-start justify-center overflow-y-auto">
            <div className="w-full max-w-[360px] min-h-screen bg-[#0a0a0c] text-gray-200 shadow-2xl border-x border-[#1f1f2e] p-3 space-y-3 flex flex-col justify-between relative">
              
              <div className="space-y-3 pb-4">
                {/* Header */}
                <div className="bg-[#050505] border border-[#2d2d3a] rounded-xl p-2 text-center relative overflow-hidden">
                  <div className="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-cyan-500 to-transparent animate-pulse"></div>
                  <h1 className="text-xs font-mono text-cyan-400 font-bold tracking-widest uppercase">🧠 ANALYCODE v3.8</h1>
                  <p className="text-[9px] text-gray-500 font-mono">Strict Anchor Protocol</p>
                </div>

                {/* Input */}
                <textarea
                  className="w-full h-20 bg-[#12121a] border border-[#2d2d3a] rounded-xl p-2 font-mono text-[10px] text-gray-300 resize-none focus:outline-none focus:border-cyan-500 transition-colors"
                  placeholder="Collez le code source ici..."
                  value={sourceCode}
                  onChange={(e) => setSourceCode(e.target.value)}
                />

                {/* RENDU */}
                <div className="bg-[#050508] border border-[#2d2d3a] rounded-xl p-1 relative shadow-inner">
                  {isolatedBlock ? (
                    <LiveSandBox code={isolatedBlock} sourceCode={sourceCode} />
                  ) : (
                    <div className="text-gray-600 italic text-[10px] border border-dashed border-[#2d2d3a] rounded-lg h-20 flex items-center justify-center bg-black/20 font-mono">
                      AUCUNE CONTAMINATION DE TAG
                    </div>
                  )}
                </div>

                {/* CONTROLES */}
                <div className="bg-[#12121a] border border-[#2d2d3a] rounded-xl p-2 flex items-center justify-between gap-1.5 shadow-lg">
                  <input
                    type="text"
                    className="w-[35%] bg-black/40 border border-[#2d2d3a] rounded-lg p-1.5 font-mono text-xs text-cyan-300 focus:outline-none"
                    value={searchTerm}
                    onChange={(e) => setSearchTerm(e.target.value)}
                    placeholder="Jeton..."
                  />
                  <div className="flex items-center gap-1">
                    <button onClick={() => setCurrentMatchIdx(p => (p - 1 + matches.length) % matches.length)} disabled={matches.length === 0} className="bg-black/50 border border-[#2d2d3a] w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold active:bg-cyan-500/20 disabled:opacity-20">◀</button>
                    <span className="text-[9px] font-mono bg-black px-1 py-1 rounded-md min-w-[32px] text-center border border-black text-gray-400">
                      {matches.length > 0 ? `${currentMatchIdx + 1}/${matches.length}` : "0/0"}
                    </span>
                    <button onClick={() => setCurrentMatchIdx(p => (p + 1) % matches.length)} disabled={matches.length === 0} className="bg-black/50 border border-[#2d2d3a] w-7 h-7 flex items-center justify-center rounded-lg text-xs font-bold active:bg-cyan-500/20 disabled:opacity-20">▶</button>
                    
                    <button 
                      onClick={handleCopyState}
                      disabled={!sourceCode}
                      className={`h-7 px-2 font-mono text-[9px] font-bold rounded-lg border transition-all flex items-center justify-center gap-1 disabled:opacity-20 ${stateCopied ? "bg-emerald-500/20 border-emerald-500 text-emerald-400" : "bg-cyan-500/20 border-cyan-500/40 text-cyan-300 active:scale-95"}`}
                    >
                      {stateCopied ? "✓ EXPORTÉ" : "📋 STATE"}
                    </button>
                  </div>
                </div>

                {/* SOURCE CODE ZONE */}
                <div className="bg-[#050508] border border-[#2d2d3a] rounded-xl p-2 relative shadow-inner">
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-[9px] font-mono text-gray-500 tracking-wider">✂️ BLOC STRICT SÉLECTIONNÉ :</span>
                    {isolatedBlock && (
                      <button 
                        onClick={handleCopy}
                        className={`text-[9px] font-mono px-2 py-0.5 rounded transition-all ${copied ? "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30" : "bg-cyan-500/20 text-cyan-300 border border-cyan-500/30 active:scale-95"}`}
                      >
                        {copied ? "COPIÉ" : "COPIER"}
                      </button>
                    )}
                  </div>
                  <div className="context-block text-gray-300 bg-black/60 p-2 rounded-lg border border-[#161622] max-h-24 overflow-y-auto">
                    {isolatedBlock ? isolatedBlock : <span className="text-gray-600 italic text-[10px] font-mono">En attente...</span>}
                  </div>
                </div>

                {/* Tabs */}
                <div className="space-y-1.5 pt-1">
                  <div className="flex gap-0.5 border-b border-[#2d2d3a] pb-0.5 overflow-x-auto">
                    {[
                      { id: "structure", label: "🏗️ Tags" },
                      { id: "customs", label: `⚛️ Customs (${dynamicComponents.length})` },
                      { id: "hooks", label: "⚓ Hooks" },
                      { id: "events", label: "⚡ Events" },
                      { id: "styles", label: "🎨 Styles" }
                    ].map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`text-[9px] font-mono px-2 py-1 rounded-t-lg border-t border-x transition-colors whitespace-nowrap ${activeTab === tab.id ? "bg-[#12121a] border-[#2d2d3a] text-cyan-400 font-bold" : "border-transparent text-gray-500 hover:text-gray-300"}`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  {/* Grid */}
                  <div className="grid grid-cols-2 gap-1.5 max-h-24 overflow-y-auto pr-0.5">
                    {categories[activeTab]?.length > 0 ? (
                      categories[activeTab].map((item, idx) => (
                        <button
                          key={idx}
                          onClick={() => {
                            if (window.navigator?.vibrate) window.navigator.vibrate(10);
                            setSearchTerm(item);
                          }}
                          className={`p-2 rounded-lg border font-mono text-[10px] text-left truncate transition-all ${searchTerm === item ? "bg-cyan-500/10 border-cyan-500 text-cyan-300" : "bg-[#12121a] border-[#2d2d3a] text-gray-400 hover:border-gray-700"}`}
                        >
                          📍 {item}
                        </button>
                      ))
                    ) : (
                      <div className="col-span-2 text-center text-gray-600 italic text-[10px] py-2 font-mono bg-[#111116] rounded-lg border border-[#2d2d3a]">
                        Aucun élément détecté.
                      </div>
                    )}
                  </div>
                </div>

              </div>

              {/* Footer */}
              <div className="text-center text-[8px] font-mono text-gray-700 pt-1 border-t border-[#1a1a24]">
                ANALYCODE ENGINE v3.8 • ANCHOR ISOLATION VERIFIED
              </div>

            </div>
          </div>
        );
      };

      window.reactRoot = window.reactRoot || ReactDOM.createRoot(document.getElementById('root'));
      window.reactRoot.render(<CodeExplorer />);
    })();
  </script>
</body>
</html>
